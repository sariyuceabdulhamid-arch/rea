name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions: {}

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    # Secrets are not passed to pull requests from forks.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Review pull request
        uses: anthropics/claude-code-action@6b6870e649b5ff408753befeaee5fc7989d4e6a9 # v1.0.258
        with:
          # Set either secret: CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`, Pro/Max plan) or ANTHROPIC_API_KEY.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read AGENTS.md first and hold the change to its rules.
            Only comment on lines this pull request changes.

            Look for:
            - Correctness bugs, regressions, and unhandled malformed input, cancellation, or cleanup paths.
            - Security issues: command or path injection, prompt injection through analyzed artifacts, leaked credentials.
            - Breaking changes to CLI/MCP contracts that are not marked with `!` or a `BREAKING CHANGE:` footer.
            - Missing or weakened tests for changed behavior.
            - Comments or docs the change made stale.

            Post each finding as an inline comment with mcp__github_inline_comment__create_inline_comment.
            Then post one short summary with `gh pr comment`. If there are no findings, say so in one line.
            Do not comment on style that the formatter or linter already enforces.
          claude_args: |
            --permission-mode auto
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
